name: Find leads for customers

on:
  schedule:
    - cron: "0 15 * * *"   # every day at 15:00 UTC
  workflow_dispatch:        # lets you press "Run workflow" by hand

permissions:
  contents: read

jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # Free open AI model that runs inside this job (no account, no cost).
      # To try another one, add a repository variable LEADFINDER_LOCAL_MODEL.
      LOCAL_MODEL: ${{ vars.LEADFINDER_LOCAL_MODEL || 'qwen2.5:3b' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      # If this step fails, the job still runs with keyword scoring only.
      - name: Start the free AI model
        id: ai
        continue-on-error: true
        timeout-minutes: 12
        shell: bash
        run: bash scripts/start_ai.sh "$LOCAL_MODEL"

      - name: Find, check and save leads
        shell: bash
        run: |
          set -o pipefail
          python -u cloud_worker.py 2>&1 | tee worker.log
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          REDDITAPIS_KEY: ${{ secrets.REDDITAPIS_KEY }}
          SE_KEY: ${{ secrets.SE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LEADFINDER_USER_AGENT: ${{ secrets.LEADFINDER_USER_AGENT }}
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          LEADFINDER_LOCAL_MODEL: ${{ steps.ai.outcome == 'success' && env.LOCAL_MODEL || '' }}

      # Short summary shown at the top of the run page (also readable through the GitHub API)
      - name: Summary
        if: always()
        shell: bash
        run: |
          [ -f worker.log ] || exit 0
          grep -E "posts$|AI check|Drafts:|leads shown|calls used|active product|Weekly summary|Emails:|email sent|email:" worker.log | head -15 | sed 's/^ *//' | paste -sd '|' | sed 's/|/ | /g' | xargs -0 -I{} echo "::notice title=Lead run::{}"
          grep -E "^ *!" worker.log | sort | uniq -c | sort -rn | head -8 | sed 's/^ *//' | while read -r l; do echo "::warning title=Lead run problem::$l"; done
