name: Find leads for customers

on:
  schedule:
    - cron: "0 15 * * *"   # every day at 15:00 UTC
  workflow_dispatch:        # lets you press "Run workflow" by hand

jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python cloud_worker.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          REDDITAPIS_KEY: ${{ secrets.REDDITAPIS_KEY }}
          SE_KEY: ${{ secrets.SE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LEADFINDER_USER_AGENT: ${{ secrets.LEADFINDER_USER_AGENT }}
