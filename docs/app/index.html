<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lead Finder: find people asking for your product</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6F8FA;--card:#fff;--text:#14202B;--muted:#5B6B78;--line:#DCE3E8;--accent:#0F766E;--accent-t:#fff;--hl:#FFE066;--hl-t:#14202B;--good:#15803d;--bad:#b42318;--warn:#b45309;--soft:#EAF1F3;--shadow:0 1px 2px rgba(20,32,43,.06),0 8px 24px rgba(20,32,43,.06)}
@media (prefers-color-scheme:dark){:root{--bg:#0E1419;--card:#16202A;--text:#E9EEF2;--muted:#93A4B2;--line:#25323E;--accent:#34D1C0;--accent-t:#06201D;--hl:#FFE066;--hl-t:#14202B;--good:#4ade80;--bad:#f87171;--warn:#fbbf24;--soft:#1B2833;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25)}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 "Schibsted Grotesk",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
a{color:inherit}
mark{background:var(--hl);color:var(--hl-t);padding:0 .15em;border-radius:3px}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
.brand{font-weight:800;font-size:19px;letter-spacing:-.02em;text-decoration:none;display:inline-flex;align-items:center;gap:8px}
.brand i{display:inline-block;width:22px;height:22px;border-radius:6px;background:var(--hl);box-shadow:inset 0 -6px 0 var(--accent)}
/* buttons */
button{font:inherit;font-weight:600;padding:9px 16px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--text);cursor:pointer;transition:background .15s,border-color .15s}
button:hover{border-color:var(--muted)}
button.primary{background:var(--accent);color:var(--accent-t);border-color:var(--accent)}
button.primary:hover{filter:brightness(1.08)}
button.big{padding:13px 22px;font-size:17px;border-radius:11px}
button.on{border-color:var(--accent);background:var(--accent);color:var(--accent-t)}
button.up.on{background:var(--good);border-color:var(--good);color:#fff}button.down.on{background:var(--bad);border-color:var(--bad);color:#fff}
button.link{border:0;background:none;color:var(--accent);padding:0;font-weight:600}
button.link:hover{text-decoration:underline}
/* app header */
header{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:12px 20px;background:var(--card);border-bottom:1px solid var(--line)}
header .brand{margin-right:10px}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav a{color:var(--muted);text-decoration:none;padding:7px 12px;border-radius:8px;font-weight:600}
nav a.on{color:var(--text);background:var(--soft)}
.sp{flex:1}
main{max-width:920px;margin:0 auto;padding:24px 20px 60px}
main.landing{max-width:none;padding:0}
h2{font-size:26px;letter-spacing:-.02em;margin:6px 0 16px}h3{font-size:17px;margin:0 0 6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:0 0 12px}
label{display:block;font-weight:600;margin:14px 0 5px}
.hint{color:var(--muted);font-size:14px;font-weight:400}
input,textarea,select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--text);font:inherit}
textarea{min-height:92px;resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{display:inline-block;padding:1px 10px;border-radius:99px;font-size:13px;background:var(--soft);color:var(--muted);font-weight:600}
.score{font-weight:800;border-radius:9px;padding:2px 10px;color:var(--accent-t);background:var(--muted);min-width:34px;text-align:center}
.s-hi{background:var(--good);color:#fff}.s-mid{background:var(--warn);color:#fff}
.lead a.t{font-weight:700;font-size:17px;text-decoration:none;line-height:1.35}.lead a.t:hover{text-decoration:underline}
.meta{color:var(--muted);font-size:14px;margin:5px 0}
.angle{border-left:4px solid var(--accent);background:var(--soft);padding:8px 12px;margin:10px 0;font-size:15px;border-radius:0 9px 9px 0}
.snip{color:var(--muted);font-size:15px;margin:8px 0 12px}
.err{color:var(--bad)}.ok{color:var(--good)}
.count{font-size:14px;color:var(--muted)}.count.over{color:var(--bad);font-weight:700}
table{width:100%;border-collapse:collapse;font-size:15px}th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
.auth{max-width:400px;margin:48px auto}
.empty{color:var(--muted);text-align:center;padding:34px 12px}
/* landing */
.lnav{display:flex;align-items:center;gap:12px;padding:16px 0}
.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:48px;align-items:center;padding:28px 0 44px}
.hero h1{font-size:clamp(36px,5.2vw,58px);line-height:1.04;letter-spacing:-.035em;margin:0 0 18px;font-weight:800}
.hero p.lead{font-size:19px;color:var(--muted);max-width:34em;margin:0 0 26px}
.hero .fine{font-size:14px;color:var(--muted);margin-top:12px}
.sample{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;box-shadow:var(--shadow)}
.sample .tag{font-size:13px;font-weight:700;color:var(--muted);margin-bottom:10px;display:flex;justify-content:space-between;gap:8px}
.sample h3{font-size:19px;line-height:1.3;margin:6px 0 8px}
.sample p{margin:0 0 12px;color:var(--muted);font-size:15px}
.sec{padding:36px 0;border-top:1px solid var(--line)}
.sec h2{font-size:clamp(24px,3vw,32px);letter-spacing:-.03em;max-width:20em;margin:0 0 10px}
.sec p.sub{color:var(--muted);font-size:17px;max-width:38em;margin:0 0 14px}
.steps{list-style:none;margin:18px 0 0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:28px}
.steps li{display:block;padding:0}
.steps .n{margin-bottom:8px}
.steps .n{font-size:34px;font-weight:800;color:var(--accent);line-height:1;letter-spacing:-.04em}
.steps h3{font-size:20px;margin:0 0 4px}.steps p{margin:0;color:var(--muted);max-width:40em}
.two{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:start}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:0;padding:0;list-style:none}
.chips li{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:8px 16px;font-weight:600}
.where{margin:0;padding:0;list-style:none;display:grid;gap:10px;font-size:18px}
.where span{color:var(--muted);font-size:15px;margin-left:6px}
.cta{background:var(--accent);color:var(--accent-t);border-radius:20px;padding:30px 36px;margin:10px 0 32px;display:flex;gap:20px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.cta h2{margin:0 0 6px;font-size:clamp(24px,3vw,32px);letter-spacing:-.03em}.cta p{margin:0;opacity:.9;max-width:34em}
.cta button{background:var(--hl);color:var(--hl-t);border-color:var(--hl)}
footer.f{border-top:1px solid var(--line);padding:18px 0 28px;color:var(--muted);font-size:14px}
@media (max-width:820px){.hero,.two{grid-template-columns:1fr;gap:28px}.hero{padding-top:20px}.sample{}.steps{grid-template-columns:1fr;gap:20px}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
</style>
</head>
<body>
<header id="top" hidden>
  <a class="brand" href="#/leads"><i></i><span id="appname">Lead Finder</span></a>
  <nav id="nav"></nav>
  <span class="sp"></span>
  <span class="count" id="lastrun"></span>
  <button id="signout">Sign out</button>
</header>
<main id="app"></main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
(function () {
"use strict";
var CFG = window.LEADFINDER_CONFIG || {};
var sb = window.__TEST_SB__ || window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY);
var $ = function (s, r) { return (r || document).querySelector(s); };
var state = { user: null, projects: [], msg: "" };

/* ---------- starter packs: everything is editable after choosing ---------- */
var PACKS = {
  blank: { label: "Start from blank", name: "", description: "", context: "", keywords: [], competitors: [], exclude: [], subreddits: [], se_sites: [], small: true },
  "sf-duplicates": { label: "Salesforce: duplicate leads", name: "", context: "salesforce",
    description: "Finds and merges duplicate leads, contacts and accounts in Salesforce and prevents new duplicates.",
    keywords: ["duplicate leads", "duplicate records", "dedupe", "merge duplicates", "duplicate rules", "duplicate management"],
    competitors: ["Cloudingo", "DemandTools", "Plauti", "RingLead", "Dedupely", "Insycle"],
    exclude: ["exam", "certification", "trailhead", "apex", "soql"], subreddits: ["salesforce", "salesforceadmin"], se_sites: ["salesforce"], small: true },
  "sf-routing": { label: "Salesforce: lead routing and territories", name: "", context: "salesforce",
    description: "Assigns leads and accounts to the right sales rep automatically (round robin, territories, rules).",
    keywords: ["lead routing", "lead assignment", "round robin", "territory management", "assignment rules", "territory assignment"],
    competitors: ["LeanData", "Chili Piper", "Distribution Engine"],
    exclude: ["exam", "certification", "trailhead", "apex"], subreddits: ["salesforce", "salesforceadmin"], se_sites: ["salesforce"], small: true },
  "sf-cpq": { label: "Salesforce: CPQ and quoting", name: "", context: "salesforce",
    description: "Helps teams build quotes, pricing and proposals in Salesforce faster.",
    keywords: ["salesforce cpq", "quote template", "quoting process", "price book", "product bundles", "quote approval"],
    competitors: ["DealHub", "Conga", "PandaDoc", "Nue"],
    exclude: ["exam", "certification", "trailhead"], subreddits: ["salesforce", "salesforceadmin"], se_sites: ["salesforce"], small: true },
  "sf-quality": { label: "Salesforce: data quality", name: "", context: "salesforce",
    description: "Cleans and standardizes Salesforce data (bad emails, missing fields, messy imports).",
    keywords: ["data quality", "dirty data", "data cleanup", "data enrichment", "bad data", "standardize data"],
    competitors: ["ZoomInfo", "Clearbit", "DemandTools", "Openprise"],
    exclude: ["exam", "certification", "trailhead", "apex"], subreddits: ["salesforce", "salesforceadmin"], se_sites: ["salesforce"], small: true },
  restaurant: { label: "Restaurants: tips, scheduling, payroll", name: "", context: "restaurant",
    description: "Software for restaurants, for example tip pooling and tip distribution, scheduling or payroll for servers and kitchen staff.",
    keywords: ["tip pooling", "tip distribution", "tip out", "tip sharing", "split tips", "tip tracking", "restaurant payroll tips"],
    competitors: ["7shifts", "Homebase", "Toast", "Tipalti"],
    exclude: ["homework", "recipe", "reservation"], subreddits: ["restaurateur", "restaurantowners", "KitchenConfidential", "Serverlife"], se_sites: [], small: true }
};

/* ---------- small helpers (all text is written with textContent) ---------- */
function el(tag, attrs, kids) {
  var e = document.createElement(tag);
  Object.keys(attrs || {}).forEach(function (k) {
    if (k === "class") e.className = attrs[k];
    else if (k === "text") e.textContent = attrs[k];
    else if (k.slice(0, 2) === "on") e.addEventListener(k.slice(2), attrs[k]);
    else if (attrs[k] !== false && attrs[k] != null) e.setAttribute(k, attrs[k] === true ? "" : attrs[k]);
  });
  (kids || []).forEach(function (c) { if (c) e.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
  return e;
}
function clear(n) { while (n.firstChild) n.removeChild(n.firstChild); }
function lines(text) { return text.split(/[\n,]/).map(function (s) { return s.trim(); }).filter(Boolean); }
function safeUrl(u) { return /^https?:\/\//i.test(u || "") ? u : "#"; }
function ago(iso) {
  if (!iso) return "";
  var d = Math.floor((Date.now() - new Date(iso).getTime()) / 86400000);
  return d <= 0 ? "today" : d === 1 ? "1 day ago" : d + " days ago";
}
function say(msg, bad) { state.msg = { t: msg, bad: !!bad }; }
function msgNode() {
  if (!state.msg) return null;
  var n = el("p", { class: state.msg.bad ? "err" : "ok", role: "status", text: state.msg.t });
  state.msg = "";
  return n;
}
function nice(err) { return (err && err.message) ? err.message : "Something went wrong. Please try again."; }

/* ---------- routing ---------- */
function route() { return (location.hash || (state.user ? "#/leads" : "#/")).slice(2).split("/"); }
function go(h) { if (location.hash === h) render(); else location.hash = h; }
window.addEventListener("hashchange", render);

function drawNav(r) {
  var nav = $("#nav"); clear(nav);
  [["leads", "Leads"], ["products", "My products"], ["working", "What's working"]].forEach(function (x) {
    nav.appendChild(el("a", { href: "#/" + x[0], class: r[0] === x[0] ? "on" : "", text: x[1] }));
  });
}

async function loadProjects() {
  var res = await sb.from("projects").select("*").order("created_at", { ascending: true });
  if (res.error) throw res.error;
  state.projects = res.data || [];
}

var renderId = 0;
async function render() {
  var my = ++renderId;
  var app = $("#app");
  if (!state.user) {
    $("#top").hidden = true; app.className = "landing";
    var h = route()[0];
    return (h === "signin" || h === "signup" || h === "reset") ? drawAuth(app, h) : drawLanding(app);
  }
  app.className = "";
  $("#top").hidden = false;
  $("#appname").textContent = CFG.APP_NAME || "Lead Finder";
  var r = route();
  drawNav(r);
  clear(app);
  try {
    await loadProjects();
    var lr = await sb.from("app_status").select("last_run").maybeSingle();
    if (my !== renderId) return;   // a newer draw has started: drop this one
    $("#lastrun").textContent = lr && lr.data && lr.data.last_run ? "Last search: " + ago(lr.data.last_run) : "No search has run yet";
    if (r[0] === "products") return r[1] === "new" ? drawForm(app, null) : r[1] === "edit" ? drawForm(app, state.projects.filter(function (p) { return p.id === r[2]; })[0]) : drawProducts(app);
    if (r[0] === "working") return drawWorking(app);
    return drawLeads(app, r[1]);
  } catch (e) { app.appendChild(el("p", { class: "err", text: nice(e) })); }
}


/* ---------- landing page (signed out) ---------- */
function mk(text, words) {
  // text with the matched words marked, built safely (no HTML parsing)
  var frag = document.createDocumentFragment();
  var ws = (words || []).filter(Boolean).map(function (w) { return w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); });
  if (!ws.length || !text) { frag.appendChild(document.createTextNode(text || "")); return frag; }
  var re = new RegExp("(" + ws.join("|") + ")", "ig");
  String(text).split(re).forEach(function (part, i) {
    if (i % 2 === 1) frag.appendChild(el("mark", { text: part })); else if (part) frag.appendChild(document.createTextNode(part));
  });
  return frag;
}
function drawLanding(app) {
  clear(app);
  function toSignup() { location.hash = "#/signup"; }
  var hero = el("section", { class: "hero" }, [
    el("div", {}, [
      el("h1", { text: "Be there the day someone asks for what you make." }),
      el("p", { class: "lead", text: "Give us the phrases that give a need away. Every morning we scan public posts for them and hand you the matches, each with an idea for your reply." }),
      el("div", { class: "row" }, [el("button", { class: "primary big", id: "startfree", text: "Get started", onclick: toSignup })]),
      el("p", { class: "fine", text: "Free while we test. No card needed." })
    ]),
    el("div", { class: "sample", "aria-label": "Sample post" }, [
      el("div", { class: "tag" }, [el("span", { text: "Sample post" }), el("span", { class: "score s-hi", text: "9" })]),
      el("div", { class: "meta", text: "r/salesforce, 2 days ago" }),
      (function () { var h = el("h3"); h.appendChild(mk("Anyone found a dedupe tool that isn't expensive for a small team?", ["dedupe tool"])); return h; })(),
      (function () { var p = el("p"); p.appendChild(mk("Our web-to-lead form keeps creating duplicate leads and native rules miss half of them.", ["duplicate leads"])); return p; })(),
      el("div", { class: "meta" }, [el("span", { class: "pill", text: "Wants a tool" }), " Why: asks for a tool, small team, price-sensitive"]),
      el("div", { class: "angle", text: "Reply idea: Explain how to catch web-to-lead duplicates with matching rules first. Mention a tool only if they ask." })
    ])
  ]);
  var how = el("section", { class: "sec" }, [
    el("h2", { text: "Set it up once. It checks every day." }),
    el("ol", { class: "steps" }, [
      ["1", "Pick your words", "Add the phrases that give a need away, like \"tip pooling\" or \"duplicate leads\". Or begin with one of our sets."],
      ["2", "We search for you", "Each morning we look through public posts and rate every new one against your words."],
      ["3", "You answer, as yourself", "Every lead shows why it was picked and a way to help. You write and send the reply yourself."]
    ].map(function (x) { return el("li", {}, [el("div", { class: "n", text: x[0] }), el("div", {}, [el("h3", { text: x[1] }), el("p", { text: x[2] })])]); }))
  ]);
  var pays = el("div", {}, [
    el("h2", { text: "See what pays off" }),
    el("p", { class: "sub", text: "Give each lead a thumbs up or down and mark it replied, interested or won. A page then shows which lead types turn into customers." }),
    el("p", { class: "sub", text: "We only use public posts. We never post, vote or message for you." })
  ]);
  var sets = el("div", {}, [
    el("h2", { text: "Begin with a ready set, or write your own" }),
    el("p", { class: "sub", text: "Every set fills in your words and rival products. You can change all of it." }),
    el("ul", { class: "chips" }, ["Salesforce: duplicate leads", "Salesforce: lead routing", "Salesforce: CPQ and quoting", "Salesforce: data quality", "Restaurants: tips, scheduling, payroll", "Your own product"].map(function (x) { return el("li", { text: x }); }))
  ]);
  var cta = el("section", { class: "cta" }, [
    el("div", {}, [el("h2", { text: "Put your product to the test" }), el("p", { text: "Free while we test. Up to 3 products. Your first leads arrive after the next daily search." })]),
    el("button", { class: "big", id: "startfree2", text: "Create an account", onclick: toSignup })
  ]);
  var foot = el("footer", { class: "f" }, [el("p", { text: "Lead Finder reads public posts only. A person writes every reply. Early test version." })]);
  var nav = el("div", { class: "lnav" }, [el("a", { class: "brand", href: "#/" }, [el("i"), "Lead Finder"]), el("span", { class: "sp" }),
    el("button", { id: "navsignin", text: "Sign in", onclick: function () { location.hash = "#/signin"; } })]);
  app.appendChild(el("div", { class: "wrap" }, [nav, hero, how, el("section", { class: "sec two" }, [pays, sets]), cta, foot]));
}

/* ---------- sign in / sign up ---------- */
function drawAuth(app, first) {
  clear(app);
  var mode = first === "signup" ? "up" : first === "reset" ? "reset" : "in";
  var box = el("div", { class: "card auth" });
  var back = el("p", {}, [el("a", { class: "brand", href: "#/" }, [el("i"), "Lead Finder"])]);
  function draw() {
    clear(box);
    box.appendChild(el("h2", { text: mode === "in" ? "Sign in" : mode === "up" ? "Create your account" : "Reset password" }));
    var m = msgNode(); if (m) box.appendChild(m);
    var email = el("input", { type: "email", id: "email", autocomplete: "email", required: true });
    var pw = el("input", { type: "password", id: "pw", autocomplete: mode === "up" ? "new-password" : "current-password", minlength: "8" });
    box.appendChild(el("label", { for: "email", text: "Email" })); box.appendChild(email);
    if (mode !== "reset") { box.appendChild(el("label", { for: "pw", text: "Password" })); box.appendChild(pw); }
    var go1 = el("button", { class: "primary", id: "authgo", text: mode === "in" ? "Sign in" : mode === "up" ? "Sign up" : "Send reset email", onclick: async function () {
      var e = email.value.trim(), p = pw.value;
      if (!e) { say("Please type your email.", true); return draw(); }
      if (mode !== "reset" && p.length < 8) { say("Password must have at least 8 characters.", true); return draw(); }
      var res;
      if (mode === "in") res = await sb.auth.signInWithPassword({ email: e, password: p });
      else if (mode === "up") res = await sb.auth.signUp({ email: e, password: p, options: { emailRedirectTo: location.href.split("#")[0] } });
      else res = await sb.auth.resetPasswordForEmail(e, { redirectTo: location.href.split("#")[0] });
      if (res.error) { say(nice(res.error), true); return draw(); }
      if (mode === "up" && !res.data.session) { say("Almost done. Check your email and click the confirmation link."); mode = "in"; return draw(); }
      if (mode === "reset") { say("If this email has an account, a reset link is on its way."); mode = "in"; return draw(); }
    } });
    box.appendChild(el("p", {}, [go1]));
    var links = el("p", { class: "row" });
    if (mode !== "in") links.appendChild(el("button", { class: "link", text: "I have an account", onclick: function () { mode = "in"; draw(); } }));
    if (mode !== "up") links.appendChild(el("button", { class: "link", text: "Create an account", onclick: function () { mode = "up"; draw(); } }));
    if (mode === "in") links.appendChild(el("button", { class: "link", text: "Forgot password", onclick: function () { mode = "reset"; draw(); } }));
    box.appendChild(links);
    box.appendChild(el("p", { class: "hint", text: "We only use public posts. We never post for you." }));
  }
  draw();
  app.appendChild(el("div", { class: "wrap" }, [back, box]));
}

/* ---------- products ---------- */
function drawProducts(app) {
  app.appendChild(el("h2", { text: "My products" }));
  var m = msgNode(); if (m) app.appendChild(m);
  if (!state.projects.length) {
    app.appendChild(el("div", { class: "card empty" }, [el("p", { text: "You have no product yet. Add one and the daily search will start tomorrow morning." })]));
  }
  state.projects.forEach(function (p) {
    var c = el("div", { class: "card" });
    c.appendChild(el("h3", { text: p.name }));
    c.appendChild(el("p", { class: "meta", text: p.keywords.length + " keywords: " + p.keywords.join(", ") }));
    if (p.subreddits.length) c.appendChild(el("p", { class: "meta", text: "Communities: " + p.subreddits.map(function (s) { return "r/" + s; }).join(", ") }));
    c.appendChild(el("div", { class: "row" }, [
      el("button", { text: "See leads", onclick: function () { go("#/leads/" + p.id); } }),
      el("button", { text: "Edit", onclick: function () { go("#/products/edit/" + p.id); } }),
      el("button", { text: "Delete", onclick: async function () {
        if (!confirm("Delete " + p.name + " and its leads?")) return;
        var res = await sb.from("projects").delete().eq("id", p.id);
        say(res.error ? nice(res.error) : "Deleted.", !!res.error); render();
      } })
    ]));
    app.appendChild(c);
  });
  if (state.projects.length < 3) app.appendChild(el("button", { class: "primary", id: "addprod", text: "Add a product", onclick: function () { go("#/products/new"); } }));
  else app.appendChild(el("p", { class: "hint", text: "The free plan allows up to 3 products." }));
}

function drawForm(app, p) {
  var isNew = !p;
  p = p || { name: "", description: "", context: "", keywords: [], competitors: [], exclude_words: [], examples: [], subreddits: [], se_sites: [], small_companies: true, pack: null };
  app.appendChild(el("h2", { text: isNew ? "Add a product" : "Edit " + p.name }));
  var m = msgNode(); if (m) app.appendChild(m);
  var f = el("div", { class: "card" });
  var packSel = el("select", { id: "pack" }, Object.keys(PACKS).map(function (k) { return el("option", { value: k, text: PACKS[k].label }); }));
  if (isNew) { f.appendChild(el("label", { for: "pack", text: "Start with a ready-made set (you can change everything)" })); f.appendChild(packSel); }
  var name = el("input", { id: "name", maxlength: "80", value: p.name });
  var desc = el("textarea", { id: "desc", maxlength: "600" }); desc.value = p.description;
  var ctx = el("input", { id: "ctx", maxlength: "60", value: p.context });
  var kw = el("textarea", { id: "kw" }); kw.value = p.keywords.join("\n");
  var kwCount = el("span", { class: "count", id: "kwcount" });
  var comp = el("textarea", { id: "comp" }); comp.value = p.competitors.join("\n");
  var exc = el("textarea", { id: "exc" }); exc.value = p.exclude_words.join("\n");
  var ex = el("textarea", { id: "ex" }); ex.value = p.examples.join("\n---\n");
  var subs = el("textarea", { id: "subs" }); subs.value = p.subreddits.join("\n");
  var ses = el("input", { id: "ses", value: p.se_sites.join(", ") });
  var small = el("input", { type: "checkbox", id: "small", style: "width:auto" }); small.checked = p.small_companies;
  function count() { var n = lines(kw.value).length; kwCount.textContent = n + " of 12"; kwCount.className = "count" + (n > 12 ? " over" : ""); }
  kw.addEventListener("input", count);
  function add(label, hint, node, extra) {
    f.appendChild(el("label", { text: label }, [hint ? el("span", { class: "hint", text: " " + hint }) : null]));
    f.appendChild(node); if (extra) f.appendChild(extra);
  }
  add("Product name", "", name);
  add("What problem does it solve?", "in plain words, who it is for", desc);
  add("Keywords", "one per line, up to 12: words people use when they have the problem", kw, kwCount);
  add("Context word", "optional, for example: salesforce or restaurant", ctx);
  add("Competitors", "optional, up to 10: a post that mentions one scores high", comp);
  add("Words to avoid", "optional, up to 10: posts with these score lower", exc);
  add("Example posts", "optional, up to 3, separate with a line of ---: posts you wish you had found", ex);
  add("Reddit communities", "up to 8, one per line, for example: restaurateur", subs);
  add("Stack Exchange sites", "up to 4, separated by commas, for example: salesforce", ses);
  f.appendChild(el("label", {}, [small, " Favour small companies and startups"]));
  packSel.addEventListener("change", function () {
    var k = packSel.value, x = PACKS[k];
    if (!name.value) name.value = x.name; desc.value = x.description; ctx.value = x.context;
    kw.value = x.keywords.join("\n"); comp.value = x.competitors.join("\n"); exc.value = x.exclude.join("\n");
    subs.value = x.subreddits.join("\n"); ses.value = x.se_sites.join(", "); small.checked = x.small; count();
  });
  f.appendChild(el("p", { class: "row" }, [
    el("button", { class: "primary", id: "save", text: "Save", onclick: async function () {
      var k = lines(kw.value);
      if (!name.value.trim()) { say("Please type a product name.", true); return render(); }
      if (k.length < 1 || k.length > 12) { say("Use between 1 and 12 keywords (you have " + k.length + ").", true); return render(); }
      var row = {
        name: name.value.trim(), description: desc.value.trim(), context: ctx.value.trim(), keywords: k,
        competitors: lines(comp.value), exclude_words: lines(exc.value),
        examples: ex.value.split(/^\s*---\s*$/m).map(function (s) { return s.trim(); }).filter(Boolean),
        subreddits: lines(subs.value), se_sites: lines(ses.value), small_companies: small.checked,
        pack: isNew ? packSel.value : p.pack
      };
      var res = isNew ? await sb.from("projects").insert(row) : await sb.from("projects").update(row).eq("id", p.id);
      if (res.error) { state.draft = null; say(nice(res.error), true); return render(); }
      say("Saved. The daily search will use these words from the next run."); go("#/products");
    } }),
    el("button", { text: "Cancel", onclick: function () { go("#/products"); } })
  ]));
  app.appendChild(f); count();
}

/* ---------- leads ---------- */
var STATUSES = ["replied", "interested", "won", "ignored"];
async function drawLeads(app, pid) {
  app.appendChild(el("h2", { text: "Leads" }));
  if (!state.projects.length) {
    app.appendChild(el("div", { class: "card empty" }, [el("p", { text: "Add your first product to start getting leads." }),
      el("button", { class: "primary", text: "Add a product", onclick: function () { go("#/products/new"); } })]));
    return;
  }
  var cur = state.projects.filter(function (p) { return p.id === pid; })[0] || state.projects[0];
  var bar = el("div", { class: "card row" });
  var ps = el("select", { id: "fproj" }, state.projects.map(function (p) { return el("option", { value: p.id, text: p.name }); }));
  ps.value = cur.id;
  var min = el("select", { id: "fmin" }, [["4", "Score 4 and up"], ["7", "Score 7 and up (best)"], ["1", "All matches"]].map(function (x) { return el("option", { value: x[0], text: x[1] }); }));
  var typ = el("select", { id: "ftype" }, [["", "All types"], ["tool_request", "Wants a tool"], ["competitor", "Mentions a competitor"], ["pain", "Has the problem"], ["discussion", "Discussion"]].map(function (x) { return el("option", { value: x[0], text: x[1] }); }));
  var hide = el("input", { type: "checkbox", id: "fhide", style: "width:auto" }); hide.checked = true;
  var csv = el("button", { id: "csv", text: "Export CSV" });
  bar.appendChild(ps); bar.appendChild(min); bar.appendChild(typ);
  bar.appendChild(el("label", { style: "margin:0;font-weight:400" }, [hide, " hide ignored"])); bar.appendChild(csv);
  app.appendChild(bar);
  var list = el("div", { id: "list" }); app.appendChild(list);
  var rows = [];
  function paint() {
    clear(list);
    var shown = rows.filter(function (r) { return (!typ.value || r.intent === typ.value) && !(hide.checked && r.status === "ignored"); });
    if (!shown.length) {
      list.appendChild(el("div", { class: "card empty" }, [el("p", { text: rows.length ? "No leads match these filters." : "No leads yet. The search runs once a day. New posts appear here after the next run." })]));
      return;
    }
    shown.forEach(function (r) { list.appendChild(leadCard(r, cur, paint)); });
  }
  async function load() {
    var res = await sb.from("my_leads").select("*").eq("project_id", cur.id).gte("score", Number(min.value)).order("score", { ascending: false }).limit(500);
    if (res.error) { list.appendChild(el("p", { class: "err", text: nice(res.error) })); return; }
    rows = (res.data || []).slice().sort(function (a, b) { return b.score - a.score || new Date(b.posted_at) - new Date(a.posted_at); });
    paint();
  }
  ps.addEventListener("change", function () { go("#/leads/" + ps.value); });
  min.addEventListener("change", load); typ.addEventListener("change", paint); hide.addEventListener("change", paint);
  csv.addEventListener("click", function () { downloadCsv(rows, cur.name); });
  load();
}

async function saveStatus(r, cur, patch) {
  var row = Object.assign({ project_id: cur.id, url: r.url, source: r.source, title: (r.title || "").slice(0, 300), intent: r.intent, score: r.score }, patch);
  var res = await sb.from("lead_status").upsert(row, { onConflict: "project_id,url" });
  if (res.error) alert(nice(res.error)); else Object.assign(r, patch);
}

function leadCard(r, cur, repaint) {
  var c = el("div", { class: "card lead" });
  var cls = r.score >= 7 ? "score s-hi" : r.score >= 4 ? "score s-mid" : "score";
  c.appendChild(el("div", { class: "row" }, [el("span", { class: cls, text: String(r.score) }),
    (function () { var a = el("a", { class: "t", href: safeUrl(r.url), target: "_blank", rel: "noopener noreferrer" }); a.appendChild(mk(r.title || "(no title)", cur.keywords)); return a; })()]));
  c.appendChild(el("div", { class: "meta" }, [el("span", { class: "pill", text: (r.intent || "").replace("_", " ") }), " " + (r.source || "") + " · " + ago(r.posted_at)]));
  if (r.reason) c.appendChild(el("div", { class: "meta", text: "Why: " + r.reason }));
  if (r.angle) c.appendChild(el("div", { class: "angle", text: "Reply idea: " + r.angle }));
  if (r.snippet) { var sn = el("div", { class: "snip" }); sn.appendChild(mk(r.snippet, cur.keywords)); c.appendChild(sn); }
  var row = el("div", { class: "row" });
  STATUSES.forEach(function (s) {
    row.appendChild(el("button", { class: r.status === s ? "on" : "", "data-s": s, text: s, onclick: async function () { await saveStatus(r, cur, { status: r.status === s ? null : s }); repaint(); } }));
  });
  row.appendChild(el("span", { class: "sp" }));
  row.appendChild(el("button", { class: "up" + (r.feedback === "good" ? " on" : ""), title: "Good lead", "aria-label": "Good lead", text: "👍", onclick: async function () { await saveStatus(r, cur, { feedback: r.feedback === "good" ? null : "good" }); repaint(); } }));
  row.appendChild(el("button", { class: "down" + (r.feedback === "bad" ? " on" : ""), title: "Bad lead", "aria-label": "Bad lead", text: "👎", onclick: async function () { await saveStatus(r, cur, { feedback: r.feedback === "bad" ? null : "bad" }); repaint(); } }));
  c.appendChild(row);
  return c;
}

function downloadCsv(rows, name) {
  function q(v) { v = String(v == null ? "" : v); if (/^[=+\-@]/.test(v)) v = "'" + v; return '"' + v.replace(/"/g, '""') + '"'; }
  var out = ["score,type,status,source,posted,title,url,why,reply idea"];
  rows.forEach(function (r) { out.push([r.score, r.intent, r.status, r.source, r.posted_at, r.title, r.url, r.reason, r.angle].map(q).join(",")); });
  var a = el("a", { href: URL.createObjectURL(new Blob([out.join("\n")], { type: "text/csv" })), download: name.replace(/\W+/g, "_") + "_leads.csv" });
  document.body.appendChild(a); a.click(); a.remove();
}

/* ---------- what's working ---------- */
async function drawWorking(app) {
  app.appendChild(el("h2", { text: "What's working" }));
  var res = await sb.from("lead_status").select("*").limit(2000);
  if (res.error) return app.appendChild(el("p", { class: "err", text: nice(res.error) }));
  var rows = res.data || [];
  if (!rows.length) return app.appendChild(el("div", { class: "card empty" }, [el("p", { text: "Nothing here yet. On the Leads page, mark leads as replied, interested or won, and use the thumbs. This page then shows which communities and lead types turn into customers." })]));
  var names = {}; state.projects.forEach(function (p) { names[p.id] = p.name; });
  function by(key) {
    var m = {};
    rows.forEach(function (r) {
      var k = r[key] || "unknown"; m[k] = m[k] || { replied: 0, interested: 0, won: 0, good: 0, bad: 0 };
      if (r.status && m[k][r.status] !== undefined) m[k][r.status]++;
      if (r.feedback === "good") m[k].good++; if (r.feedback === "bad") m[k].bad++;
    });
    return m;
  }
  function table(title, key) {
    var m = by(key), c = el("div", { class: "card" }, [el("h3", { text: title })]);
    var t = el("table"); t.appendChild(el("tr", {}, ["", "Replied", "Interested", "Won", "Good", "Bad"].map(function (h) { return el("th", { text: h }); })));
    Object.keys(m).sort(function (a, b) { return (m[b].won * 3 + m[b].interested * 2 + m[b].replied) - (m[a].won * 3 + m[a].interested * 2 + m[a].replied); }).forEach(function (k) {
      var v = m[k]; t.appendChild(el("tr", {}, [(key === "project_id" ? names[k] || k : k), v.replied, v.interested, v.won, v.good, v.bad].map(function (x) { return el("td", { text: String(x) }); })));
    });
    c.appendChild(t); app.appendChild(c);
  }
  table("By community", "source"); table("By lead type", "intent");
  if (state.projects.length > 1) table("By product", "project_id");
  app.appendChild(el("p", { class: "hint", text: "Your thumbs up/down are saved with every lead. When the AI key is on, liked leads help it write better reply ideas." }));
}

/* ---------- start ---------- */
$("#signout").addEventListener("click", async function () { await sb.auth.signOut(); location.hash = "#/"; });
sb.auth.onAuthStateChange(function (_e, session) {
  var u = session && session.user ? session.user : null;
  if ((u && u.id) === (state.user && state.user.id)) return;
  state.user = u;
  if (u && /^#\/(signin|signup|reset)?$|^$/.test(location.hash)) location.hash = "#/leads"; else render();
});
sb.auth.getSession().then(function (r) {
  var s = r && r.data && r.data.session;
  if (!state.user && s) { state.user = s.user; }
  if (state.user && /^#\/(signin|signup|reset)?$|^$/.test(location.hash)) location.hash = "#/leads"; else render();
});
})();
</script>
